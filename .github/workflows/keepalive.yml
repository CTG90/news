name: Keep alive

# GitHub pauses scheduled workflows after 60 days with no commits.
# This makes one tiny commit a month so the news keeps updating.
on:
  schedule:
    - cron: '17 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > .github/keepalive
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Keep alive" && git push || true
