name: Update news

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min (GitHub may run it a few minutes late)
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev || npm install --omit=dev
      - run: node scripts/fetch-news.mjs
      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet && exit 0
          git commit -m "Update news $(date -u +%H:%M)"
          git pull --rebase -X theirs || true
          git push
