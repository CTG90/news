name: Update news

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 min (GitHub may run it a few minutes late)
  workflow_dispatch:          # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch news
        run: node scripts/fetch-news.mjs

      - name: Restore alert keys and history
        uses: actions/cache/restore@v5
        with:
          path: |
            push-keys.json
            push-state.json
          key: push-state-${{ github.run_id }}
          restore-keys: push-state-
      - name: Send breaking alerts
        env:
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
        run: node scripts/push.mjs
      - name: Save alert keys and history
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            push-keys.json
            push-state.json
          key: push-state-${{ github.run_id }}

      - name: Build site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icons data _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
