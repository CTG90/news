<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coke's News</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="News">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#fff; --bg2:#f2f2f7; --card:#fff; --text:#000; --sub:#6c6c70; --line:rgba(60,60,67,.18);
  --accent:#fa2d48; --up:#1a9d4b; --down:#e0352b; --chip:#e9e9ee; --blur:rgba(255,255,255,.82);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000; --bg2:#1c1c1e; --card:#1c1c1e; --text:#fff; --sub:#98989f; --line:rgba(84,84,88,.5);
  --up:#30d158; --down:#ff453a; --chip:#2c2c2e; --blur:rgba(0,0,0,.78);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(84px + var(--safe-b))}

/* Header */
header{padding:calc(var(--safe-t) + 14px) 0 4px;display:flex;align-items:flex-end;justify-content:space-between}
.brand{font:800 34px/1 -apple-system,"SF Pro Display",sans-serif;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.date{color:var(--sub);font-weight:600;font-size:15px;margin-top:4px;text-transform:uppercase;letter-spacing:.02em}
.refresh{width:36px;height:36px;border-radius:50%;background:var(--chip);display:grid;place-items:center}
.refresh svg{width:18px;height:18px}
.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* Chips */
.chips{position:sticky;top:0;z-index:5;margin:8px -16px 0;padding:calc(var(--safe-t)*0 + 8px) 16px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:var(--blur);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:18px;background:var(--chip);font-weight:600;font-size:15px;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg)}

/* Markets */
.mkts{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:6px -16px 4px;padding:2px 16px}
.mkts::-webkit-scrollbar{display:none}
.q{display:block;flex:none;background:var(--bg2);border-radius:12px;padding:9px 12px;min-width:108px}
.q b{display:block;font-size:13px;color:var(--sub);font-weight:600}
.q .p{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.q .c{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}

/* Breaking */
.breaking{margin:12px 0 4px;background:var(--accent);color:#fff;border-radius:14px;padding:12px 14px;display:block}
.breaking .lbl{font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.9;display:flex;align-items:center;gap:6px}
.breaking .lbl i{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.breaking .t{font-weight:700;font-size:17px;margin-top:4px}
.breaking .m{font-size:13px;opacity:.85;margin-top:3px}

/* Section heading */
h2{font:800 26px/1.1 -apple-system,"SF Pro Display",sans-serif;letter-spacing:-.01em;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 button{font-size:15px;font-weight:600;color:var(--accent)}
h2 .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:middle}

/* Cards */
.hero{display:block;background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.06)}
.hero .img{aspect-ratio:16/9}
.hero .body{padding:12px 14px 14px}
.hero .t{font:700 22px/1.2 -apple-system,"SF Pro Display",sans-serif;letter-spacing:-.01em;margin:4px 0 6px}
.hero .s{color:var(--sub);font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.src{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);display:flex;gap:6px;align-items:center}
.src .tag{background:var(--accent);color:#fff;border-radius:4px;padding:1px 5px;font-size:10px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--sub);font-size:13px;margin-top:8px}
.save{width:30px;height:30px;display:grid;place-items:center;margin:-6px -6px -6px 0;color:var(--sub)}
.save svg{width:18px;height:18px}
.save.on{color:var(--accent)}
.row{display:flex;gap:12px;padding:12px 0;border-top:.5px solid var(--line)}
.row .txt{flex:1;min-width:0}
.row .t{font-weight:700;font-size:17px;line-height:1.25;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row .img{width:92px;height:92px;border-radius:10px;flex:none}
.img{background:var(--bg2) center/cover no-repeat;position:relative;overflow:hidden}
.img.ph{display:grid;place-items:center;color:#fff;font:800 20px/1 -apple-system,sans-serif;letter-spacing:.02em}
.hero .img.ph{font-size:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.mini{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mini .img{aspect-ratio:4/3}
.mini .body{padding:8px 10px 10px}
.mini .t{font-weight:700;font-size:15px;line-height:1.25;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mini .meta{margin-top:4px}
@media (prefers-color-scheme:dark){.hero,.mini{box-shadow:none}}
@media (min-width:640px){.row .img{width:120px;height:90px}}

.more{display:block;width:100%;margin:8px 0 0;padding:12px;border-radius:12px;background:var(--bg2);font-weight:600;color:var(--accent)}
.empty{color:var(--sub);text-align:center;padding:60px 20px}
.upd{color:var(--sub);font-size:12px;text-align:center;margin:24px 0 0}
.search{width:100%;margin:10px 0 4px;padding:11px 14px;border-radius:12px;border:0;background:var(--bg2);color:var(--text);font:inherit;font-size:17px;outline:none}

/* Tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:space-around;padding:6px 0 calc(var(--safe-b) + 6px);background:var(--blur);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:600;color:var(--sub);min-width:70px}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 80px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.hint{background:var(--bg2);border-radius:12px;padding:12px 14px;color:var(--sub);font-size:15px;margin-bottom:12px}
.games{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 4px;padding:2px 16px}
.games::-webkit-scrollbar{display:none}
.game{flex:none;width:138px;background:var(--bg2);border-radius:12px;padding:8px 10px;font-size:14px}
.game.fav{box-shadow:inset 0 0 0 2px var(--accent)}
.gl{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.live{font-style:normal;background:var(--accent);color:#fff;border-radius:4px;padding:0 4px;font-size:10px}
.tm{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--sub);line-height:1.6}
.tm img{width:18px;height:18px;object-fit:contain}
.tm span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm small{font-size:10px;color:var(--sub)}
.tm b{font-variant-numeric:tabular-nums;color:var(--text)}
.game.pre .tm,.game.in .tm,.tm.w{color:var(--text)}
.gd{font-size:12px;color:var(--sub);margin-top:3px}
#sheet h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);margin:22px 0 2px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pill{display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:16px;padding:6px 12px;font-size:15px;font-weight:600}
.pill input{accent-color:var(--accent)}
.btns{display:flex;gap:10px;margin:8px 0}
.btn{background:var(--accent);color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px}
.btn.ghost{background:var(--bg2);color:var(--accent)}
.code{width:100%;height:64px;margin-top:8px;border:0;border-radius:10px;background:var(--bg2);color:var(--text);font:12px/1.3 ui-monospace,Menlo,monospace;padding:8px;resize:none}
.chip.edit{background:none;color:var(--accent);padding-left:6px}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#sheet .panel{background:var(--bg);width:100%;max-width:720px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(var(--safe-b) + 20px)}
#sheet .head{display:flex;justify-content:space-between;align-items:center;font-size:20px}
#sheet .head button{color:var(--accent);font-weight:700;font-size:17px}
#sheet .sub{color:var(--sub);font-size:14px;margin:4px 0 10px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:.5px solid var(--line);font-size:17px;font-weight:600}
.srow label{display:flex;align-items:center;gap:10px;flex:1}
.srow input{width:22px;height:22px;accent-color:var(--accent)}
.srow .dot{width:10px;height:10px;border-radius:3px}
.srow span button{width:36px;height:32px;color:var(--sub);font-size:14px}
.srow span button:disabled{opacity:.25}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="brand" id="brand">News</div><div class="date" id="date"></div></div>
    <button class="refresh" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button>
  </header>
  <div class="chips" id="chips"></div>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<nav>
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm2 3v4h6V7H6zm8 0v2h4V7h-4zm0 4v2h4v-2h-4zm-8 2v2h12v-2H6zm0 4v1h12v-1H6z"/></svg>Today</button>
  <button data-tab="saved"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>Saved</button>
  <button data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</button>
</nav>
<div class="toast" id="toast"></div>
<div id="sheet"><div class="panel">
  <div class="head"><b>Settings</b><button data-done>Done</button></div>
  <h3>Scores</h3><div class="sub">Leagues to show, plus your teams (they always show first, e.g. <i>Gamecocks, Clemson, Panthers</i>).</div>
  <div id="leagues" class="pills"></div><input id="teams" class="search" type="text" placeholder="Your teams, separated by commas" autocomplete="off">
  <h3>Breaking alerts</h3><div id="alerts"></div>
  <h3>Sections</h3><div class="sub">Uncheck to hide. Use the arrows to reorder.</div><div class="list"></div>
  <h3>Move to another device</h3><div class="sub">Copies your saved stories, sections, teams and For You history.</div>
  <div class="btns"><button class="btn" data-sync-copy>Copy sync code</button></div>
  <textarea id="synccode" class="code" placeholder="Paste a sync code from your other device"></textarea><div class="btns"><button class="btn ghost" data-sync-load>Load code</button></div>
</div></div>
<script>
const COLORS = { cyber:'#c92a2a', national:'#0a84ff', sc:'#7a2b8f', politics:'#d63a3a', tech:'#5e5ce6', sneakers:'#ff9f0a', stocks:'#1a9d4b', economy:'#0f7d8c', sports:'#e8590c', entertainment:'#d6336c', science:'#1098ad', health:'#2f9e44', rides:'#495057', photography:'#ae3ec9' };
const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let data = null, tab = 'today', section = store.get('section', 'top'), query = '', expanded = {};
let saved = store.get('saved', []);
let prefs = Object.assign({ order: [], hidden: [], leagues: ['nfl', 'cfb', 'nba'], teams: '' }, store.get('prefs', {}));
let taste = Object.assign({ sec: {}, src: {}, kw: {}, n: 0, seen: [] }, store.get('taste', {}));
let games = [];

const LEAGUES = {
  nfl: { name: 'NFL', path: 'football/nfl' }, cfb: { name: 'College Football', short: 'NCAAF', path: 'football/college-football', college: true },
  nba: { name: 'NBA', path: 'basketball/nba' }, cbb: { name: 'College Basketball', short: 'NCAAB', path: 'basketball/mens-college-basketball', college: true },
  mlb: { name: 'MLB', path: 'baseball/mlb' }, nhl: { name: 'NHL', path: 'hockey/nhl' },
};
const STOP = new Set('about after again against also among another because been before being between could does doing during each from have having into just more most much must only other over said says should since some such than that their them then there these they this those through under until very what when where which while will with would your year years after first last people state says report says week today amid back near'.split(' '));
// Sections in your chosen order, minus hidden ones. New sections show up at the end.
function sectionIds(all = false) {
  const ids = Object.keys(data?.sections || {});
  const ordered = [...prefs.order.filter((id) => ids.includes(id)), ...ids.filter((id) => !prefs.order.includes(id))];
  return all ? ordered : ordered.filter((id) => !prefs.hidden.includes(id));
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'Just now'; if (m < 60) return `${m}m ago`;
  const h = Math.round(m / 60); if (h < 24) return `${h}h ago`;
  return `${Math.round(h / 24)}d ago`;
}
function initials(s) { return s.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase(); }
function img(a, cls = '') {
  const c = COLORS[a.section] || '#888';
  const ph = `background:linear-gradient(135deg,${c},${c}aa)`;
  if (!a.image) return `<div class="img ph ${cls}" style="${ph}">${esc(initials(a.source))}</div>`;
  return `<div class="img ${cls}" style="${ph}" data-i="${esc(initials(a.source))}"><img src="${esc(a.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" onerror="var p=this.parentNode;this.remove();p.classList.add('ph');p.textContent=p.dataset.i"></div>`;
}
const isSaved = (a) => saved.some((s) => s.link === a.link);
const bm = (a) => `<button class="save ${isSaved(a) ? 'on' : ''}" data-save="${esc(a.link)}" aria-label="Save"><svg viewBox="0 0 24 24" fill="${isSaved(a) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>`;
const src = (a) => `<div class="src">${a.breaking ? '<span class="tag">BREAKING</span>' : ''}${esc(a.source)}</div>`;
const link = (a, inner, cls) => `<a class="${cls}" href="${esc(a.link)}" target="_blank" rel="noopener">${inner}</a>`;

const hero = (a) => link(a, `${img(a)}<div class="body">${src(a)}<div class="t">${esc(a.title)}</div>${a.summary ? `<div class="s">${esc(a.summary)}</div>` : ''}<div class="meta"><span>${ago(a.time)}</span>${bm(a)}</div></div>`, 'hero');
const row = (a) => link(a, `<div class="txt">${src(a)}<div class="t">${esc(a.title)}</div><div class="meta"><span>${ago(a.time)}</span>${bm(a)}</div></div>${img(a)}`, 'row');
const mini = (a) => link(a, `${img(a)}<div class="body">${src(a)}<div class="t">${esc(a.title)}</div><div class="meta"><span>${ago(a.time)}</span>${bm(a)}</div></div>`, 'mini');

function markets() {
  if (!data.markets?.length) return '';
  return `<div class="mkts">${data.markets.map((q) => {
    const d = q.change >= 0 ? 'up' : 'down', s = q.change >= 0 ? '+' : '';
    const p = q.price >= 1000 ? q.price.toLocaleString(undefined, { maximumFractionDigits: 0 }) : q.price.toFixed(2);
    const url = q.url || `https://finance.yahoo.com/quote/${encodeURIComponent(q.sym)}`;
    return `<a class="q" href="${esc(url)}" target="_blank" rel="noopener"><b>${esc(q.label)}</b><div class="p">${p}${q.suffix || ''}</div><div class="c ${d}">${s}${q.pct.toFixed(2)}%</div></a>`;
  }).join('')}</div>`;
}

// Live scores from ESPN's public scoreboard, loaded straight from your phone.
const favList = () => prefs.teams.split(',').map((t) => t.trim().toLowerCase()).filter(Boolean);
async function loadScores() {
  const fav = favList();
  const isFav = (t) => fav.some((f) => [t.team.abbreviation, t.team.displayName, t.team.shortDisplayName, t.team.name, t.team.location].some((n) => n && (n.toLowerCase() === f || (f.length > 3 && n.toLowerCase().includes(f)))));
  const res = await Promise.all(prefs.leagues.filter((l) => LEAGUES[l]).map(async (l) => {
    try {
      const j = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${LEAGUES[l].path}/scoreboard`).then((r) => r.json());
      return (j.events || []).map((e) => {
        const c = e.competitions[0], side = (h) => c.competitors.find((x) => x.homeAway === h);
        const team = (t) => ({ abbr: t.team.abbreviation, logo: t.team.logo, score: t.score, rank: t.curatedRank?.current, fav: isFav(t) });
        const home = team(side('home')), away = team(side('away'));
        return { league: LEAGUES[l].short || LEAGUES[l].name, college: LEAGUES[l].college, link: e.links?.[0]?.href, state: e.status.type.state, detail: e.status.type.shortDetail, date: Date.parse(e.date), home, away, fav: home.fav || away.fav };
      });
    } catch { return []; }
  }));
  const rank = (t) => t.rank && t.rank <= 25;
  games = res.flat().filter((g) => g.fav || !g.college || rank(g.home) || rank(g.away))
    .filter((g) => g.state !== 'pre' || g.date - Date.now() < 36 * 3600e3)
    .sort((a, b) => (b.fav - a.fav) || ({ in: 0, pre: 1, post: 2 }[a.state] - { in: 0, pre: 1, post: 2 }[b.state]) || (a.date - b.date));
  const el = document.getElementById('scores');
  if (el) el.outerHTML = scoresStrip(el.dataset.mode);
}
function scoresStrip(mode = 'all') {
  let g = games;
  if (mode === 'top') g = g.filter((x) => x.fav || x.state === 'in').slice(0, 10);
  if (!g.length) return `<div id="scores" data-mode="${mode}"></div>`;
  const tm = (t, win) => `<div class="tm ${win ? 'w' : ''}">${t.logo ? `<img src="${esc(t.logo)}" alt="" loading="lazy">` : ''}<span>${t.rank && t.rank <= 25 ? `<small>${t.rank}</small> ` : ''}${esc(t.abbr)}</span><b>${esc(t.score ?? '')}</b></div>`;
  const card = (x) => {
    const hw = x.state === 'post' && +x.home.score > +x.away.score, aw = x.state === 'post' && +x.away.score > +x.home.score;
    const when = x.state === 'pre' ? new Date(x.date).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : x.detail;
    return `<a class="game ${x.fav ? 'fav' : ''} ${x.state}" href="${esc(x.link || '#')}" target="_blank" rel="noopener"><div class="gl">${esc(x.league)}${x.state === 'in' ? ' <i class="live">LIVE</i>' : ''}</div>${tm(x.away, aw)}${tm(x.home, hw)}<div class="gd">${esc(when)}</div></a>`;
  };
  return `<div id="scores" data-mode="${mode}" class="games">${g.slice(0, 30).map(card).join('')}</div>`;
}

function allArticles() { return sectionIds().flatMap((id) => data.articles[id] || []); }

function breakingBanner() {
  const b = allArticles().filter((a) => a.breaking).sort((x, y) => y.time - x.time)[0];
  if (!b) return '';
  return `<a class="breaking" href="${esc(b.link)}" target="_blank" rel="noopener"><div class="lbl"><i></i>BREAKING · ${esc(data.sections[b.section] || '')}</div><div class="t">${esc(b.title)}</div><div class="m">${esc(b.source)} · ${ago(b.time)}</div></a>`;
}

// For You: learns from what you open and save (kept on this device).
const words = (t) => t.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter((w) => w.length > 3 && !STOP.has(w));
function learn(a, w) {
  if (!a) return;
  const bump = (m, k, v) => { m[k] = (m[k] || 0) * 0.995 + v; };
  bump(taste.sec, a.section, w); bump(taste.src, a.source, w);
  for (const k of new Set(words(a.title))) bump(taste.kw, k, w * 0.5);
  const kws = Object.entries(taste.kw).sort((x, y) => y[1] - x[1]).slice(0, 400);
  taste.kw = Object.fromEntries(kws);
  taste.n++;
  if (w <= 1) taste.seen = [a.link, ...taste.seen.filter((l) => l !== a.link)].slice(0, 300);
  store.set('taste', taste);
}
function forYou() {
  // Greedy pick with a small penalty for repeating a section, so one interest doesn't take over.
  const pool = scored(), out = [], per = {};
  while (pool.length && out.length < 120) {
    let bi = 0, bs = -1e9;
    for (let i = 0; i < pool.length; i++) { const v = pool[i].score - 1.1 * (per[pool[i].a.section] || 0); if (v > bs) { bs = v; bi = i; } }
    const [x] = pool.splice(bi, 1); out.push(x.a); per[x.a.section] = (per[x.a.section] || 0) + 1;
  }
  return out;
}
function scored() {
  const max = (m) => Math.max(1, ...Object.values(m));
  const ms = max(taste.sec), mr = max(taste.src), mk = max(taste.kw);
  const seen = new Set(taste.seen);
  return allArticles().filter((a) => !seen.has(a.link)).map((a) => {
    const h = (Date.now() - a.time) / 3600e3;
    const kw = Math.min(3, words(a.title).reduce((n, w) => n + (taste.kw[w] || 0) / mk, 0));
    return { a, score: 3 * (taste.sec[a.section] || 0) / ms + 1.5 * (taste.src[a.source] || 0) / mr + kw + 2 * Math.exp(-h / 18) + (a.image ? 0.3 : 0) };
  }).sort((x, y) => y.score - x.score);
}

// Top: a mix across sections, preferring stories with images and breaking news.
function topStories() {
  // Ranked server-side by how widely a story is covered, Google Top Stories, and recency.
  if (data.top?.length) {
    const by = new Map(allArticles().map((a) => [a.link, a]));
    const banner = allArticles().filter((a) => a.breaking).sort((a, b) => b.time - a.time)[0];
    const ranked = data.top.map((l) => by.get(l)).filter((a) => a && a !== banner);
    const lead = ranked.slice(0, 4).findIndex((a) => a.image);
    if (lead > 0) ranked.unshift(ranked.splice(lead, 1)[0]);
    if (ranked.length >= 8) return ranked.slice(0, 16);
  }
  const out = [];
  const lists = sectionIds().map((id) => (data.articles[id] || []).slice(0, 8));
  const used = new Set();
  const breaking = allArticles().filter((a) => a.breaking).sort((a, b) => b.time - a.time);
  if (breaking[0]) used.add(breaking[0].link); // already in the red banner
  breaking.slice(1, 3).forEach((a) => { out.push(a); used.add(a.link); });
  for (let i = 0; out.length < 16 && i < 8; i++) for (const l of lists) {
    const a = l[i]; if (a && !used.has(a.link)) { out.push(a); used.add(a.link); }
  }
  const lead = out.findIndex((a) => a.image);
  if (lead > 0) out.unshift(out.splice(lead, 1)[0]);
  return out.slice(0, 16);
}

function sectionBlock(id, n = 5) {
  const l = data.articles[id] || [];
  if (!l.length) return '';
  const first = l.find((a) => a.image) || l[0];
  const rest = l.filter((a) => a !== first);
  const pair = rest.filter((a) => a.image).slice(0, 2);
  const others = rest.filter((a) => !pair.includes(a)).slice(0, n - 1 - pair.length);
  return `<h2><span><span class="dot" style="background:${COLORS[id]}"></span>${esc(data.sections[id])}</span><button data-go="${id}">See all</button></h2>
    ${hero(first)}${pair.length === 2 ? `<div class="grid2">${pair.map(mini).join('')}</div>` : pair.map(row).join('')}${others.map(row).join('')}`;
}

function renderToday() {
  if (section === 'top') {
    const top = topStories();
    return `${markets()}${scoresStrip('top')}${breakingBanner()}<h2>Top Stories</h2>${top[0] ? hero(top[0]) : ''}${top.slice(1).map(row).join('')}
      ${sectionIds().map((id) => sectionBlock(id)).join('')}${footer()}`;
  }
  if (section === 'foryou') {
    const l = forYou(), n = expanded.foryou || 25;
    const hint = taste.n < 8 ? `<div class="hint">This feed learns from the stories you open and save. ${taste.n ? `${taste.n} so far, keep reading.` : 'Start tapping stories you like.'}</div>` : '';
    return `<h2>For You</h2>${hint}${l[0] ? hero(l[0]) : ''}${l.slice(1, n).map(row).join('')}${l.length > n ? `<button class="more" data-more="foryou">Show more</button>` : ''}${footer()}`;
  }
  const l = data.articles[section] || [];
  const n = expanded[section] || 25;
  const first = l.find((a) => a.image) || l[0];
  const rest = l.filter((a) => a !== first);
  return `${section === 'stocks' || section === 'economy' ? markets() : ''}${section === 'sports' ? scoresStrip('all') : ''}
    <h2><span><span class="dot" style="background:${COLORS[section]}"></span>${esc(data.sections[section])}</span></h2>
    ${first ? hero(first) : '<div class="empty">No stories right now.</div>'}${rest.slice(0, n).map(row).join('')}
    ${rest.length > n ? `<button class="more" data-more="${section}">Show more</button>` : ''}${footer()}`;
}
function renderSaved() {
  if (!saved.length) return `<h2>Saved</h2><div class="empty">Tap the bookmark on any story to save it here.</div>`;
  return `<h2>Saved <button data-clear>Clear</button></h2>${saved.map(row).join('')}`;
}
function renderSearch() {
  const q = query.trim().toLowerCase();
  const res = q ? allArticles().filter((a) => (a.title + ' ' + a.summary + ' ' + a.source).toLowerCase().includes(q)).sort((a, b) => b.time - a.time) : [];
  return `<input class="search" id="q" type="search" placeholder="Search stories" value="${esc(query)}" autocomplete="off">
    <div id="results">${q ? (res.length ? res.slice(0, 60).map(row).join('') : '<div class="empty">No matches.</div>') : '<div class="empty">Search every section at once.</div>'}</div>`;
}
const footer = () => `<div class="upd">Updated ${ago(data.updated)} · tap ↻ to refresh</div>`;

function renderChips() {
  const ids = ['top', 'foryou', ...sectionIds()];
  if (!ids.includes(section)) section = 'top';
  $('#chips').style.display = tab === 'today' ? '' : 'none';
  $('#chips').innerHTML = ids.map((id) => `<button class="chip ${id === section ? 'on' : ''}" data-sec="${id}">${id === 'top' ? 'Top' : id === 'foryou' ? 'For You' : esc(data.sections[id])}</button>`).join('') + `<button class="chip edit" data-edit aria-label="Settings">Edit</button>`;
}
const standalone = () => navigator.standalone || matchMedia('(display-mode: standalone)').matches;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const enc = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = (c) => JSON.parse(decodeURIComponent(escape(atob(c.trim()))));
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast(`${label} copied`); }
  catch { toast('Press and hold the code to copy it'); }
}
async function alertStatus() {
  const el = $('#alerts');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    el.innerHTML = isIOS && !standalone()
      ? '<div class="sub">Add this app to your Home Screen (Share → Add to Home Screen), open it from there, then come back here to turn on alerts.</div>'
      : '<div class="sub">This browser doesn’t support alerts.</div>';
    return;
  }
  const reg = await navigator.serviceWorker.getRegistration();
  if (!reg) { el.innerHTML = '<div class="sub">Alerts work once the app is opened from its live address (ctg90.github.io/news).</div>'; return; }
  const sub = await reg.pushManager.getSubscription();
  if (sub) {
    const code = btoa(JSON.stringify(sub));
    el.innerHTML = `<div class="sub">Alerts are on for this device. To finish setup (one time), copy this code and paste it into the <b>PUSH_SUBS</b> secret in your GitHub repo (Settings → Secrets and variables → Actions). Ask Claude to open the page for you.</div>
      <textarea readonly class="code">${esc(code)}</textarea><div class="btns"><button class="btn" data-copy="${esc(code)}">Copy alert code</button><button class="btn ghost" data-alerts-off>Turn off</button></div>`;
  } else {
    el.innerHTML = `<div class="sub">Get a notification when breaking news hits National or South Carolina.</div><div class="btns"><button class="btn" data-alerts-on>Turn on alerts</button></div>`;
  }
}
function urlKey(b64) { const p = '='.repeat((4 - b64.length % 4) % 4), raw = atob((b64 + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); }
function renderSheet() {
  $('#leagues').innerHTML = Object.entries(LEAGUES).map(([id, l]) => `<label class="pill"><input type="checkbox" data-league="${id}" ${prefs.leagues.includes(id) ? 'checked' : ''}>${l.name}</label>`).join('');
  $('#teams').value = prefs.teams;
  alertStatus();
  const ids = sectionIds(true);
  $('#sheet .list').innerHTML = ids.map((id, i) => `<div class="srow">
    <label><input type="checkbox" data-toggle="${id}" ${prefs.hidden.includes(id) ? '' : 'checked'}><span class="dot" style="background:${COLORS[id] || '#888'}"></span>${esc(data.sections[id])}</label>
    <span><button data-move="${id}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Move up">▲</button><button data-move="${id}" data-dir="1" ${i === ids.length - 1 ? 'disabled' : ''} aria-label="Move down">▼</button></span></div>`).join('');
}
function render() {
  $('#date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  if (!data) return;
  renderChips();
  $('#main').innerHTML = tab === 'today' ? renderToday() : tab === 'saved' ? renderSaved() : renderSearch();
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  if (tab === 'search') { const i = $('#q'); i.oninput = () => { query = i.value; const r = renderSearch(); const tmp = document.createElement('div'); tmp.innerHTML = r; $('#results').innerHTML = tmp.querySelector('#results').innerHTML; }; }
}

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600); }

async function load(manual) {
  $('#refresh').classList.add('spin');
  try {
    const r = await fetch(`data/news.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
    store.set('cache', data);
    if (manual) toast(`Updated ${ago(data.updated)}`);
  } catch (e) {
    data = data || store.get('cache', null);
    if (!data) $('#main').innerHTML = '<div class="empty">Couldn’t load news. Check your connection and tap ↻.</div>';
    else if (manual) toast('Offline — showing last update');
  }
  $('#refresh').classList.remove('spin');
  render();
}

document.addEventListener('click', (e) => {
  const s = e.target.closest('[data-save]');
  if (s) {
    e.preventDefault(); e.stopPropagation();
    const a = allArticles().find((x) => x.link === s.dataset.save) || saved.find((x) => x.link === s.dataset.save);
    if (!a) return;
    if (isSaved(a)) { saved = saved.filter((x) => x.link !== a.link); toast('Removed'); }
    else { saved.unshift(a); learn(a, 3); toast('Saved'); }
    store.set('saved', saved); render(); return;
  }
  const c = e.target.closest('[data-sec]');
  if (c) { section = c.dataset.sec; store.set('section', section); render(); scrollTo({ top: 0 }); c.scrollIntoView({ inline: 'center', block: 'nearest' }); return; }
  const g = e.target.closest('[data-go]');
  if (g) { section = g.dataset.go; store.set('section', section); render(); scrollTo({ top: 0 }); return; }
  const m = e.target.closest('[data-more]');
  if (m) { expanded[m.dataset.more] = (expanded[m.dataset.more] || 25) + 25; render(); return; }
  const cp = e.target.closest('[data-copy]');
  if (cp) { copy(cp.dataset.copy, 'Alert code'); return; }
  if (e.target.closest('[data-sync-copy]')) { copy(enc({ prefs, saved, taste }), 'Sync code'); return; }
  if (e.target.closest('[data-sync-load]')) {
    try { const o = dec($('#synccode').value); prefs = Object.assign(prefs, o.prefs || {}); saved = o.saved || saved; taste = Object.assign(taste, o.taste || {});
      store.set('prefs', prefs); store.set('saved', saved); store.set('taste', taste); $('#synccode').value = ''; renderSheet(); loadScores(); toast('Settings loaded'); }
    catch { toast('That code didn’t work'); }
    return;
  }
  if (e.target.closest('[data-alerts-on]')) {
    (async () => {
      try {
        if (await Notification.requestPermission() !== 'granted') { toast('Notifications are blocked in Settings'); return; }
        const reg = await navigator.serviceWorker.ready;
        const { publicKey } = await fetch(`data/push.json?t=${Date.now()}`).then((r) => r.json());
        await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlKey(publicKey) });
        toast('Alerts on'); alertStatus();
      } catch (err) { toast('Couldn’t turn on alerts'); }
    })();
    return;
  }
  if (e.target.closest('[data-alerts-off]')) {
    navigator.serviceWorker.ready.then((r) => r.pushManager.getSubscription()).then((s) => s && s.unsubscribe()).then(() => { toast('Alerts off'); alertStatus(); });
    return;
  }
  const lg = e.target.closest('[data-league]');
  if (lg) { prefs.leagues = Object.keys(LEAGUES).filter((id) => document.querySelector(`[data-league="${id}"]`).checked); store.set('prefs', prefs); loadScores(); return; }
  const art = e.target.closest('a[href]');
  if (art && !e.target.closest('[data-save]') && !art.classList.contains('game')) learn(allArticles().find((x) => x.link === art.getAttribute('href')) || saved.find((x) => x.link === art.getAttribute('href')), 1);
  if (e.target.closest('[data-edit]')) { renderSheet(); $('#sheet').classList.add('open'); return; }
  if (e.target.closest('[data-done]') || e.target.id === 'sheet') { $('#sheet').classList.remove('open'); render(); return; }
  const mv = e.target.closest('[data-move]');
  if (mv) {
    const ids = sectionIds(true), i = ids.indexOf(mv.dataset.move), j = i + Number(mv.dataset.dir);
    if (j >= 0 && j < ids.length) { [ids[i], ids[j]] = [ids[j], ids[i]]; prefs.order = ids; store.set('prefs', prefs); renderSheet(); }
    return;
  }
  const tg = e.target.closest('[data-toggle]');
  if (tg) {
    const id = tg.dataset.toggle;
    prefs.hidden = tg.checked ? prefs.hidden.filter((x) => x !== id) : [...new Set([...prefs.hidden, id])];
    store.set('prefs', prefs); return;
  }
  if (e.target.closest('[data-clear]')) { saved = []; store.set('saved', saved); render(); return; }
  const t = e.target.closest('nav [data-tab]');
  if (t) { if (tab === t.dataset.tab) scrollTo({ top: 0, behavior: 'smooth' }); tab = t.dataset.tab; render(); if (tab === 'search') $('#q')?.focus(); return; }
});
$('#refresh').onclick = () => { load(true); loadScores(); };
document.addEventListener('change', (e) => { if (e.target.id === 'teams') { prefs.teams = e.target.value; store.set('prefs', prefs); loadScores(); } });
// Keep scores live while a game is on, and news fresh while the app is open.
setInterval(() => { if (!document.hidden && games.some((g) => g.state === 'in')) loadScores(); }, 60000);
setInterval(() => { if (!document.hidden) load(); }, 5 * 60000);
// Refresh when you come back to the app after 10+ minutes.
document.addEventListener('visibilitychange', () => { if (!document.hidden && data && Date.now() - (load.last || 0) > 600000) { load.last = Date.now(); load(); } });
load.last = Date.now();
data = store.get('cache', null); render();
load();
loadScores();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
